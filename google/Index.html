<div class="toast" id="toast" role="status" hidden></div><script>/* ARC Hub v0.1 — same interface in a private preview and Google Apps Script. */
(() => {
'use strict';
const paths={home:'M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z',plus:'M12 5v14M5 12h14',search:'M21 21l-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',tasks:'M9 5h12M9 12h12M9 19h12M2 5l2 2 3-4M2 12l2 2 3-4M2 19l2 2 3-4',projects:'M3 7h7l2-3h9v16H3Z',people:'M16 21v-3a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v3M20 21v-3a4 4 0 0 0-3-4M13 6a4 4 0 1 1-8 0 4 4 0 0 1 8 0M17 3a4 4 0 0 1 0 8',history:'M3 12a9 9 0 1 0 3-7M3 3v5h5M12 7v5l3 2',inbox:'M3 3h18v18H3ZM3 14h5l2 3h4l2-3h5',link:'M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2',grid:'M3 3h7v7H3ZM14 3h7v7h-7ZM3 14h7v7H3ZM14 14h7v7h-7Z',refresh:'M20 7a9 9 0 0 0-15-2L2 8M2 3v5h5M4 17a9 9 0 0 0 15 2l3-3M22 21v-5h-5',arrow:'M5 12h14M13 6l6 6-6 6',chevron:'M9 5l7 7-7 7',close:'M6 6l12 12M6 18 18 6',check:'M4 12l5 5L20 6',spark:'m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z',clock:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0M12 6v6l4 2',more:'M4 5h16M4 12h16M4 19h16',plane:'m22 2-7 20-4-9-9-4Zm0 0L11 13',book:'M3 3h6l3 3 3-3h6v16h-6l-3 2-3-2H3ZM12 6v15',leaf:'M20 3C8 1 2 7 5 15s15 3 15-12ZM4 21 16 7',download:'M12 3v12M6 9l6 6 6-6M4 16v5h16v-5',copy:'M8 8h13v13H8ZM16 8V3H3v13h5'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.grid}"/></svg>`;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const clip=(s,n=160)=>String(s??'').length>n?String(s).slice(0,n).trim()+'…':String(s??'');
const safeURL=s=>{try{const u=new URL(s);return u.protocol==='https:'?u.href:'#';}catch{return '#';}};
const external=window.ARC_BACKEND||null;
const live=!!external||!!(window.google&&google.script&&google.script.run);
let data=window.HUB_SNAPSHOT||null,view='inicio',q='',filter={context:'',minutes:'',energy:'',unknown:false,project:''},searchScope='all',projectScope='Activo',memoryScope='history';
let refreshPromise=null,busy=false,lastFocus=null,toastTimer=null,taskEditor=null,taskDraft=null,taskSort='manual',taskScope='active',orderRequest=null;
let incomingSort='manual',incomingOrderRequest=null;
try{taskSort=localStorage.getItem('arc-task-sort')||'manual';incomingSort=localStorage.getItem('arc-incoming-sort')||'manual';}catch{}
const draftKey='arc-hub-temporary-draft-v1';
const newKey=()=>window.crypto?.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
let draft={text:'',key:newKey()};
try{const local=JSON.parse(localStorage.getItem(draftKey)||'null');if(local&&typeof local.text==='string'&&typeof local.key==='string')draft=local;}catch{}
function saveDraft(){try{localStorage.setItem(draftKey,JSON.stringify(draft));return true;}catch{return false;}}
function dateISO(value){if(value==null||value==='')return '';if(typeof value==='number')return new Date(Date.UTC(1899,11,30)+Math.floor(value)*86400000).toISOString().slice(0,10);if(/^\d{4}-\d{2}-\d{2}/.test(value))return String(value).slice(0,10);const m=String(value).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:'';}
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function niceDate(v,year=false){const iso=dateISO(v);if(!iso)return v?'Fecha por revisar':'Sin fecha';return new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'short',...(year?{year:'numeric'}:{}),timeZone:'UTC'}).format(new Date(iso+'T12:00:00Z'));}
const closedState=s=>/^(completad[oa]|cancelad[oa])$/i.test(String(s||''));
const openTask=t=>!!t.ID&&!t['Fecha completada']&&!closedState(t.Estado);
const overdue=t=>{const iso=dateISO(t['Fecha objetivo']);return iso&&iso<today();};
const taskList=()=>data?.tasks?.filter(openTask)||[];
function sortedTasks(ts,mode=taskSort){const priorities={Alta:0,Media:1,Baja:2};return [...ts].sort((a,b)=>{const dates=(k,desc=false)=>{const x=dateISO(a[k]),y=dateISO(b[k]);if(!x||!y)return x?-1:y?1:0;return (desc?-1:1)*x.localeCompare(y);};if(mode==='newest')return dates('Fecha creación',true)||String(a.ID).localeCompare(String(b.ID));if(mode==='oldest')return dates('Fecha creación')||String(a.ID).localeCompare(String(b.ID));if(mode==='deadline')return dates('Fecha objetivo')||String(a.ID).localeCompare(String(b.ID));if(mode==='priority')return (priorities[a.Prioridad]??3)-(priorities[b.Prioridad]??3)||dates('Fecha objetivo')||String(a.ID).localeCompare(String(b.ID));return (Number.isFinite(a['Orden manual'])?a['Orden manual']:Infinity)-(Number.isFinite(b['Orden manual'])?b['Orden manual']:Infinity)||String(a.ID).localeCompare(String(b.ID));});}
function reviewBadge(t){const by=t['Última edición por'];if(!by&&!t['Huella revisada']&&!t['Revisado por'])return '';const reviewed=t['Revisado por']&&t['Huella revisada']&&t['Huella revisada']===t._reviewFingerprint;return `<span class="pill ${reviewed?'green':'amber'}">${esc(reviewed?'Revisado por '+t['Revisado por']:by==='Arc'?'Tu edición · pendiente de revisión':by?'Edición de '+by+' · pendiente de revisión':'Contenido cambiado · pendiente de revisión')}</span>`;}
const source=(role,row)=>`${data?.sheetUrl||'#'}#gid=${data?.tabs?.[role]??0}${row?'&range='+row:''}`;
const navs=[['inicio','home','Inicio'],['tareas','tasks','Tareas'],['proyectos','projects','Proyectos'],['personas','people','Personas'],['memoria','history','Memoria'],['incoming','inbox','Incoming'],['modulos','grid','Módulos']];
const names={inicio:'Inicio',tareas:'Tareas',proyectos:'Proyectos',personas:'Personas',memoria:'Memoria',incoming:'Incoming',modulos:'Módulos',conexion:'Conexión',mas:'Tu espacio',buscar:'Buscar'};
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,5000);}
function hydrateIcons(){document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon));}
function nav(){
 $('side-nav').innerHTML=navs.map(([v,i,label])=>`<button class="nav-button ${view===v?'active':''}" data-view="${v}" ${view===v?'aria-current="page"':''}>${icon(i)}<span class="nav-label">${label}</span>${v==='tareas'?`<span class="badge">${taskList().length}</span>`:v==='incoming'&&data?.incoming?.length?`<span class="badge">${data.incoming.length}</span>`:''}</button>`).join('');
 $('bottom-nav').innerHTML=[['inicio','plus','Capturar'],['buscar','search','Consultar'],['tareas','tasks','Tareas'],['mas','more','Más']].map(([v,i,l])=>`<button data-view="${v}" class="${view===v?'active':''}" ${view===v?'aria-current="page"':''}>${icon(i)}${l}</button>`).join('');
 $('source-link').href=source('summary');
}
function band(error){if(external&&!external.ready()){$('connection-strip').className='connection-strip';$('connection-strip').textContent=external.configured?'Conecta con Google para consultar tus datos.':'Conexión de esta versión pendiente de activar.';return;}if(live&&!data&&!error){$('connection-strip').className='connection-strip';$('connection-strip').textContent='Conectando con tus datos…';return;}const el=$('connection-strip');el.className='connection-strip'+(error?' error':live?' live':'');let stamp='';if(data?.fetchedAt)stamp=new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Madrid'}).format(new Date(data.fetchedAt));
 el.innerHTML=error?`<span>${esc(error)}${data?' · Se conserva la última lectura.':''}</span><button class="text-button" id="retry-load">Reintentar</button>`:live?`<span>Conectado a tus datos<span class="preview-detail"> · Última lectura ${esc(stamp)}</span></span><button class="text-button" data-view="conexion">Detalles</button>`:`<span><b>Vista previa</b> · Datos del ${esc(stamp)}<span class="preview-detail"> · Captura sin conectar</span></span><button class="text-button" data-view="conexion">Activar conexión</button>`;
 $('refresh').title=live?'Leer datos actuales':'Ver cómo conectar los datos';}
function heading(title,sub=''){return `<div class="page-heading"><div><div class="eyebrow">Tu espacio personal</div><h1>${esc(title)}</h1>${sub?`<p class="subtitle">${esc(sub)}</p>`:''}</div><span class="date-label">${esc(new Intl.DateTimeFormat('es-ES',{weekday:'short',day:'numeric',month:'short',timeZone:'Europe/Madrid'}).format(new Date()))}</span></div>`;}
function empty(title,desc,ico='leaf'){return `<div class="empty">${icon(ico)}<h3>${esc(title)}</h3><p>${esc(desc)}</p></div>`;}
function capture(){return `<section class="capture-card" aria-labelledby="capture-title"><div class="capture-head"><h2 id="capture-title">Que no se te escape.</h2>${icon('spark')}</div><p class="capture-caption">Una idea, algo que recordar, contexto para después.</p><form id="capture-form"><label class="sr-label" for="capture-text" hidden>Texto de la entrada</label><textarea id="capture-text" aria-label="Texto para capturar" placeholder="Lo que tienes ahora en la cabeza…" maxlength="12000" ${busy?'disabled':''}>${esc(draft.text)}</textarea><div class="capture-meta"><span id="draft-status">${draft.text?'Borrador en este dispositivo':'Puedes usar el dictado de tu teclado'}</span><span id="char-count">${draft.text.length} / 12.000</span></div><div class="capture-actions"><button class="button dark" id="capture-submit" type="submit" ${busy?'disabled':''}>${icon(live?'plus':'copy')}${live?'Guardar en Incoming':'Copiar para ChatGPT'}</button><button class="text-button" type="button" data-direct>Es una acción o corrección</button></div><p class="capture-footnote">${live?'La entrada quedará pendiente de consolidar. Guardar no crea recordatorios ni ejecuta acciones.':'Vista previa: el borrador se queda aquí. Pégalo en el proyecto de ChatGPT para incorporarlo al sistema.'}</p><p class="capture-result" id="capture-result" role="status"></p></form></section>`;}
function groupRows(){const groups=new Map();for(const t of sortedTasks(taskList())){const key=t['Proyecto ID']||t.ID;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(t);}return [...groups.entries()].map(([key,ts])=>{const pr=data.projects.find(p=>p.ID===key);return `<button class="group-row" ${pr?`data-project="${esc(key)}"`:`data-detail="tasks|${esc(ts[0].ID)}"`}><span class="tile-icon ${ts.some(overdue)?'amber':'blue'}">${icon(pr&&pr.Área==='Viajes'?'plane':pr?'projects':'tasks')}</span><span class="row-info"><b>${esc(pr?pr.Nombre:ts[0].Tarea)}</b><small>${ts.length>1?ts.length+' tareas · ':''}${ts.some(overdue)?'Fechas antiguas por revisar':ts[0]['Tiempo estimado (min)']?ts[0]['Tiempo estimado (min)']+' min · '+(ts[0]['Contexto ejecución']||'Contexto por concretar'):'Sin fecha objetivo'}</small></span><span class="row-end">${icon('chevron')}</span></button>`;}).join('');}
function projectCard(p){const count=taskList().filter(t=>t['Proyecto ID']===p.ID).length;return `<article class="project-card"><div class="project-top"><span class="eyebrow">${esc(p.Área||'Proyecto')}</span><span class="pill ${p.Estado==='Activo'?'blue':p.Estado==='Completado'?'green':''}">${esc(p.Estado||'Sin estado')}</span></div><button data-detail="projects|${esc(p.ID)}"><h3>${esc(p.Nombre)}</h3><p>${esc(clip(p.Objetivo,155))}</p></button><div class="project-bottom"><span>${count} ${count===1?'tarea abierta':'tareas abiertas'}</span><button class="text-button" data-project="${esc(p.ID)}">Ver tareas</button></div></article>`;}
function personCard(p){return `<button class="person-card" data-detail="people|${esc(p.ID)}"><div class="person-top"><span class="person-avatar">${esc((p.Nombre||'?').split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><div><h3>${esc(p.Nombre)}</h3><span class="pill">${esc(p['Grupo / ámbito']||'Personal')}</span></div></div><p>${esc(p['Temas abiertos']||p['Notas / contexto']||'Aún sin contexto registrado.')}</p></button>`;}
function home(){const pending=taskList(),projects=data.projects.filter(p=>p.Estado==='Activo');return heading('Tu punto de partida')+`<div class="home-top">${capture()}<section class="quick-card" aria-label="Situación registrada"><div class="eyebrow">Un vistazo</div><div class="quick-stats"><div><b>${pending.length}</b><span>tareas abiertas</span></div><div><b>${projects.length}</b><span>proyectos activos</span></div></div><div class="quick-note">${pending.some(overdue)?`<strong>${pending.filter(overdue).length} tareas tienen fechas antiguas.</strong> Conviene confirmar qué sigue pendiente.`:'Sin tareas con fecha objetivo pasada.'}<br><button class="text-button" data-view="incoming">${data.incoming.length?data.incoming.length+' entradas por consolidar':'Incoming al día'}</button></div></section></div><div class="columns"><section><div class="section-heading"><h2>Pendientes a mano</h2><button class="text-button" data-view="tareas">Ver todos</button></div><div class="panel">${pending.length?groupRows():empty('Sin tareas abiertas','Puedes dejar espacio libre o capturar lo siguiente cuando surja.')}</div></section><section class="project-stack"><div class="section-heading"><h2>En marcha</h2><button class="text-button" data-view="proyectos">Proyectos</button></div><div>${projects.length?projects.slice(0,2).map(projectCard).join(''):empty('Sin proyectos activos','Las ideas pueden esperar hasta que quieras actuar.')}</div></section></div><section class="secondary-section"><div class="section-heading"><h2>Personas, con contexto</h2><button class="text-button" data-view="personas">Ver personas</button></div><div class="people-strip">${data.people.filter(p=>p.Activo!==false).slice(0,3).map(personCard).join('')}</div></section>`;}
function matchesTask(t,f=filter){if(!openTask(t))return false;if(f.project&&t['Proyecto ID']!==f.project)return false;const ctx=t['Contexto ejecución'];if(f.context&&ctx!==f.context&&ctx!=='Cualquier sitio'&&!(f.unknown&&!ctx))return false;const mins=t['Tiempo estimado (min)'];if(f.minutes&&(!(typeof mins==='number'&&mins>0)?!f.unknown:mins>Number(f.minutes)))return false;const energy={Baja:1,Media:2,Alta:3};if(f.energy&&(!(t.Concentración in energy)?!f.unknown:energy[t.Concentración]>energy[f.energy]))return false;return true;}
function taskRows(ts,role='tasks'){return ts.map(t=>`<div class="task-item"><button class="task-row" data-detail="${role}|${esc(t.ID)}"><span class="task-icon">${icon('tasks')}</span><span class="task-label"><b>${esc(t.Tarea)}</b><span class="task-sub">${reviewBadge(t)}<span>${esc(t['Proyecto']||t.Área||'Sin proyecto')}</span><span>${esc(t['Contexto ejecución']||'Contexto sin definir')}</span>${t['Tiempo estimado (min)']?`<span>${esc(t['Tiempo estimado (min)'])} min</span>`:''}${overdue(t)?'<span class="pill amber">Fecha por revisar</span>':''}</span></span><span class="task-date">${t['Fecha objetivo']?esc(niceDate(t['Fecha objetivo'])):''}</span></button>${data.taskEditing&&live&&taskSort==='manual'&&taskScope==='active'?`<span class="move-controls"><button class="text-button" data-move-task="${esc(t.ID)}|up" aria-label="Subir ${esc(t.Tarea)}" ${busy||ts.indexOf(t)===0?'disabled':''}>↑</button><button class="text-button" data-move-task="${esc(t.ID)}|down" aria-label="Bajar ${esc(t.Tarea)}" ${busy||ts.indexOf(t)===ts.length-1?'disabled':''}>↓</button></span>`:''}</div>`).join('');}
function tasks(){const archived=taskScope==='archived';const chosen=sortedTasks(archived?(data.archivedTasks||[]):taskList().filter(t=>matchesTask(t)));return heading('Tareas','Elige el orden y abre una tarea para editarla.')+`<div class="task-toolbar"><label>Ordenar<select id="task-sort">${[['manual','Mi orden'],['newest','Más recientes primero'],['oldest','Más antiguas primero'],['deadline','Fecha objetivo'],['priority','Prioridad']].map(([v,l])=>`<option value="${v}" ${taskSort===v?'selected':''}>${l}</option>`).join('')}</select></label>${data.taskEditing?`<label>Mostrar<select id="task-scope"><option value="active" ${!archived?'selected':''}>Activas</option><option value="archived" ${archived?'selected':''}>Archivadas</option></select></label>`:''}</div>${!archived?`<div class="filters"><label>Desde dónde<select id="filter-context"><option value="">Cualquier contexto</option>${['Móvil','Ordenador','Presencial'].map(v=>`<option ${filter.context===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Tiempo disponible<select id="filter-minutes"><option value="">Sin límite</option>${[5,15,30,60].map(n=>`<option value="${n}" ${String(n)===filter.minutes?'selected':''}>Hasta ${n} minutos</option>`).join('')}</select></label><label>Concentración<select id="filter-energy"><option value="">Cualquier nivel</option>${['Baja','Media','Alta'].map(v=>`<option ${filter.energy===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Proyecto<select id="filter-project"><option value="">Todos</option>${data.projects.map(p=>`<option value="${esc(p.ID)}" ${filter.project===p.ID?'selected':''}>${esc(p.Nombre)}</option>`).join('')}</select></label><label class="check-label"><input type="checkbox" id="filter-unknown" ${filter.unknown?'checked':''}>Incluir requisitos sin definir</label></div>`:''}<p class="filter-info">${chosen.length} ${archived?'tareas archivadas':'de '+taskList().length+' tareas activas'}. ${filter.context||filter.energy||filter.minutes?'Los campos vacíos no prueban que una tarea encaje.':'Las fechas vencidas indican revisión, no una finalización confirmada.'}</p>${!archived&&taskSort==='manual'&&data.taskEditing?'<p class="filter-info">Usa las flechas para mover tareas. El orden se guarda en tus datos y se comparte entre dispositivos. Con filtros, se intercambian las posiciones de las tareas visibles.</p>':''}<div class="task-list">${chosen.length?taskRows(chosen,archived?'archivedTasks':'tasks'):empty('No hay coincidencias','Amplía el tiempo, cambia el contexto o incluye las tareas cuyos requisitos faltan.')}</div><div class="secondary-section"><a class="button light" href="${source('tasks')}" target="_blank" rel="noopener noreferrer">${icon('grid')}Abrir la hoja</a></div>`;}

}

async function submit(event){event.preventDefault();if(busy)return;const text=$('capture-text').value;if(!text.trim()){toast('Escribe primero lo que quieres capturar.');$('capture-text')?.focus();return;}draft.text=text;saveDraft();if(!live){const ok=await copy(text);$('capture-result').textContent=ok?'Copiado. Pégalo en este proyecto de ChatGPT para incorporarlo al sistema.':'No he podido copiarlo. Selecciona el texto y cópialo manualmente.';return;}
 busy=true;$('capture-submit').disabled=true;$('capture-submit').textContent='Guardando…';$('capture-text').disabled=true;try{if(refreshPromise)await refreshPromise;const receipt=await rpc('captureIncoming',{text,requestId:draft.key});if(!receipt?.verified||!receipt.id)throw new Error('No se ha podido verificar el guardado. Conserva el borrador y reintenta.');draft={text:'',key:newKey()};saveDraft();busy=false;toast('Guardado y verificado en Incoming · '+receipt.id);await refresh();if($('capture-text')){$('capture-text').value='';$('capture-result').textContent='Guardado y verificado · '+receipt.id;}}catch(e){const message=e.message||'No se ha podido guardar. El borrador se conserva.';if($('capture-result'))$('capture-result').textContent=message;else toast(message);}finally{busy=false;if($('capture-text'))$('capture-text').disabled=false;if($('capture-submit')){$('capture-submit').disabled=false;$('capture-submit').innerHTML=icon('plus')+'Guardar en Incoming';}}}
document.addEventListener('click',async event=>{const e=event.target.closest('button,[data-detail]');if(!e)return;if(e.dataset.moveIncoming){await moveIncoming(...e.dataset.moveIncoming.split('|'));return;}if(e.dataset.moveTask){await moveTask(...e.dataset.moveTask.split('|'));return;}if(e.id==='recover-task-draft'){const saved=taskDraft,found=data.tasks?.find(t=>t.ID===saved.editor.id)||data.archivedTasks?.find(t=>t.ID===saved.editor.id);if(!found){toast('No se encuentra la tarea. Consulta su fuente antes de repetir el cambio.');return;}taskEditor=saved.editor;lastFocus=document.activeElement;$('detail-type').textContent='Tarea · '+taskEditor.id;editTaskForm();$('task-edit-form').querySelectorAll('[data-field]').forEach(el=>el.value=saved.values[el.dataset.field]??'');$('detail-dialog').showModal();return;}if(e.id==='edit-task'){editTaskForm();return;}if(e.id==='cancel-task-edit'){if(taskEditor?.dirty&&!window.confirm('¿Descartar los cambios de esta ficha?'))return;const {role,id}=taskEditor;taskEditor=null;taskDraft=null;$('detail-dialog').close();openDetail(role,id);return;}if(e.dataset.view){setView(e.dataset.view);return;}if(e.hasAttribute('data-capture')){setView('inicio');$('capture-text')?.focus();return;}if(e.dataset.detail){openDetail(...e.dataset.detail.split('|'));return;}if(e.dataset.project){if($('detail-dialog').open)closeDetail();filter.project=e.dataset.project;setView('tareas');return;}if(e.dataset.projectScope){projectScope=e.dataset.projectScope;render();return;}if(e.dataset.memoryScope){memoryScope=e.dataset.memoryScope;render();return;}if(e.dataset.searchScope){searchScope=e.dataset.searchScope;render();return;}if(e.hasAttribute('data-direct')){direct();return;}if(e.dataset.copyPrompt){toast(await copy(e.dataset.copyPrompt)?'Petición copiada. Pégala en tu proyecto de ChatGPT.':'No se ha podido copiar la petición.');return;}if(e.id==='copy-direct'){toast(draft.text.trim()?(await copy(draft.text)?'Texto copiado. Pégalo en tu proyecto de ChatGPT.':'No se ha podido copiar.'):'Primero escribe tu texto en captura.');return;}if(e.id==='connect-google'){try{external.connect();}catch(error){toast(error.message);}return;}if(e.id==='disconnect-google'){external.disconnect();return;}if(e.id==='retry-load')refresh();});
document.addEventListener('input',e=>{if(e.target.closest?.('#task-edit-form')){taskEditor.dirty=true;if(taskEditor.pending){taskEditor.pending=null;$('task-edit-status').textContent='Comprueba el último guardado en la fuente antes de enviar cambios distintos.';}}if(e.target.id==='capture-text'){draft.text=e.target.value;const saved=saveDraft();$('draft-status').textContent=saved?'Borrador en este dispositivo':'Borrador solo en esta pestaña';$('char-count').textContent=draft.text.length+' / 12.000';}if(e.target.id==='global-search'){q=e.target.value;view='buscar';render();}});
document.addEventListener('change',e=>{if(e.target.id==='incoming-sort'){incomingSort=e.target.value;try{localStorage.setItem('arc-incoming-sort',incomingSort);}catch{}render();return;}if(e.target.id==='task-sort'){taskSort=e.target.value;try{localStorage.setItem('arc-task-sort',taskSort);}catch{}render();return;}if(e.target.id==='task-scope'){taskScope=e.target.value;render();return;}if(e.target.closest?.('#task-edit-form')){taskEditor.dirty=true;if(taskEditor.pending){taskEditor.pending=null;$('task-edit-status').textContent='Comprueba el último guardado en la fuente antes de enviar cambios distintos.';}return;}const key={'filter-context':'context','filter-minutes':'minutes','filter-energy':'energy','filter-project':'project','filter-unknown':'unknown'}[e.target.id];if(key){filter[key]=key==='unknown'?e.target.checked:e.target.value;render();}});
document.addEventListener('submit',e=>{if(e.target.id==='task-edit-form')saveTask(e);else if(e.target.id==='capture-form')submit(e);});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||$('detail-dialog').open)return;if(e.key==='/'){e.preventDefault();$('global-search').focus();}if(e.key.toLowerCase()==='n'){e.preventDefault();setView('inicio');$('capture-text')?.focus();}});
$('close-detail').addEventListener('click',closeDetail);$('detail-dialog').addEventListener('cancel',e=>{e.preventDefault();closeDetail();});$('refresh').addEventListener('click',refresh);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&live&&!busy)refresh();});window.addEventListener('online',()=>{if(live)refresh();});
setInterval(()=>{if(live&&!document.hidden&&!busy)refresh();},30000);
if(external)window.addEventListener('arc-auth-changed',()=>{data=null;q='';$('global-search').value='';if($('detail-dialog').open){if(taskEditor?.dirty&&$('task-edit-form'))taskDraft={editor:taskEditor,values:Object.fromEntries([...$('task-edit-form').querySelectorAll('[data-field]')].map(el=>[el.dataset.field,el.value]))};$('detail-dialog').close();taskEditor=null;}busy=false;orderRequest=null;incomingOrderRequest=null;render();band();if(external.ready())Promise.resolve(refreshPromise).then(()=>{if(external.ready())refresh();});});
hydrateIcons();render();band();if(live){data=null;render();if(!external||external.ready())refresh();}
// Pure functions are exposed only for local source-level validation.
if(typeof window.__ARC_TEST_HOOK__==='function')window.__ARC_TEST_HOOK__({dateISO,matchesTask,openTask,fold,esc,sortedTasks,sortedIncoming,reviewBadge,editTaskForm});
})();
</script>
