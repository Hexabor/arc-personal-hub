name: Publish HUB to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/logic.cjs && node tests/pages.cjs
      - run: python3 build.py --pages
        env:
          ARC_GOOGLE_CLIENT_ID: ${{ vars.ARC_GOOGLE_CLIENT_ID }}
          ARC_API_DEPLOYMENT_ID: ${{ vars.ARC_API_DEPLOYMENT_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
